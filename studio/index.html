<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#e85d04">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Studio Pro">
  <title>Mobile Studio Pro</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0e0e12;
      --panel: #1a1a20;
      --lane: #16161c;
      --line: #33333c;
      --text: #eeeef2;
      --dim: #9a9aa4;
      --accent: #e85d04;
      --teal: #2a9d8f;
      --red: #c92e2e;
      --safe: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, Segoe UI, sans-serif; overflow: hidden; }
    #app { height: 100%; display: flex; flex-direction: column; padding-bottom: var(--safe); }
    header { padding: 10px 12px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #c2410c);
      display: grid; place-items: center; font-weight: 800; font-size: 13px; }
    h1 { font-size: 16px; margin: 0; }
    .sub { color: var(--dim); font-size: 12px; }
    .grow { flex: 1; }
    #installBar { display: none; margin-top: 8px; }
    #installBar.show { display: block; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
    button, .filebtn {
      min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
      background: #2a2a32; color: var(--text); font-weight: 700; font-size: 13px;
    }
    button:active { transform: scale(0.98); }
    button.hot { background: var(--red); border-color: var(--accent); }
    button.play.hot { background: var(--accent); color: #1a0b00; }
    button.teal { background: var(--teal); color: #071412; border-color: transparent; }
    button.accent { background: var(--accent); color: #1a0b00; border-color: transparent; }
    button.ghost { background: transparent; }
    button.warn { background: #4a2020; }
    .filebtn { display: inline-flex; align-items: center; }
    .filebtn input { display: none; }
    #clock { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); align-self: center; }
    #tracks { flex: 1; overflow: auto; padding: 4px 12px 8px; }
    .track {
      background: var(--lane); border: 1px solid var(--line); border-radius: 14px;
      margin: 8px 0; padding: 10px; min-height: 88px;
    }
    .track.sel { border-color: var(--accent); background: #221c18; }
    .track.music { border-left: 4px solid var(--teal); }
    .track.vocal { border-left: 4px solid var(--red); }
    .thead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .tname { font-weight: 700; font-size: 14px; min-width: 78px; }
    .chip {
      width: 40px; height: 40px; border-radius: 10px; border: 0; padding: 0;
      background: #2c2c34; font-size: 12px;
    }
    .chip.on.m { background: #5a5a28; }
    .chip.on.s { background: #285a5a; }
    .chip.on.r { background: var(--red); }
    .wave { height: 36px; width: 100%; background: #0c0c10; border-radius: 8px; display: block; }
    #fx {
      background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px 12px;
    }
    #fx h2 { margin: 0 0 6px; font-size: 14px; color: var(--teal); }
    label { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 4px; }
    input[type=range] { width: 100%; height: 32px; }
    .kinds { display: flex; gap: 8px; margin: 8px 0; }
    .kinds button { flex: 1; min-height: 40px; padding: 0 8px; }
    .kinds button.on { background: var(--teal); color: #071412; }
    #msg { font-size: 12px; color: var(--dim); min-height: 18px; margin-top: 6px; }
    #iosHint { display: none; font-size: 12px; color: var(--dim); line-height: 1.4; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <div class="logo">MS</div>
        <div class="grow">
          <h1>Mobile Studio Pro</h1>
          <div class="sub">Record · mix · reverb · export on your phone</div>
        </div>
      </div>
      <div id="installBar">
        <button class="accent" id="btnInstall" type="button">Install on this phone</button>
        <p id="iosHint">iPhone: tap Share, then <strong>Add to Home Screen</strong>.</p>
      </div>
    </header>
    <div class="row">
      <button id="btnRec" type="button">REC</button>
      <button id="btnPlay" class="play" type="button">PLAY</button>
      <button id="btnStop" type="button">STOP</button>
      <label class="filebtn">Import karaoke<input id="fileKaraoke" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg"></label>
      <span id="clock">00:00 / 00:00</span>
    </div>
    <div class="row">
      <button id="btnAdd" type="button">Add vocal</button>
      <button id="btnDel" class="warn" type="button">Delete track</button>
      <button id="btnExport" class="ghost" type="button">Export WAV</button>
    </div>
    <div id="tracks"></div>
    <section id="fx">
      <h2>Supportive vocal reverb</h2>
      <div class="kinds">
        <button type="button" data-rev="0" class="on">Plate</button>
        <button type="button" data-rev="1">Room</button>
        <button type="button" data-rev="2">Hall</button>
        <button type="button" data-rev="3">Ambience</button>
      </div>
      <label>Reverb mix <span id="mixVal">22%</span></label>
      <input id="revMix" type="range" min="0" max="55" value="22">
      <label>Predelay <span id="preVal">34 ms</span></label>
      <input id="revPre" type="range" min="8" max="80" value="34">
      <div class="row" style="padding: 8px 0 0">
        <button id="btnReverb" class="teal" type="button">Apply reverb</button>
        <button id="btnStudio" class="accent" type="button">Studio voice</button>
      </div>
      <div id="msg">Import karaoke or tap REC on a vocal track.</div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
